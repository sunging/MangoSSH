# Validation never reads release secrets. Protected-branch pushes sign the verified
# unsigned APKs in an isolated job which does not check out or build repository code.
name: Android CI/CD

on:
  pull_request:
    branches:
      - main
      - develop
  push:
    branches:
      - main
      - develop
  workflow_dispatch:
    inputs:
      run_device_tests:
        description: Run both distributions against the emulator and disposable SSH fixtures
        type: boolean
        default: true

# The workflow only needs to read this repository. Artifact uploads do not need
# extra repository permissions.
permissions:
  contents: read

concurrency:
  group: android-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-and-deliver:
    name: Verify and deliver debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      # The GPL-licensed Mosh source remains reproducible through the submodule.
      - name: Check out source and native Mosh source
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      # Git preserves Windows checkout permissions, so restore the executable bit
      # required by the Linux runner before invoking the wrapper.
      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Verify the Mosh patch chain excludes GMP
        run: bash tools/test-mosh-no-gmp.sh

      # `assembleDebugAndroidTest` compiles the instrumented tests without a
      # device. CI has no emulator, so nothing else here would catch an
      # androidTest source set that no longer builds against the app it tests.
      - name: Verify version, test, lint, and package both distributions
        run: |
          ./gradlew --no-daemon \
            :app:verifyReleaseVersion \
            :app:testGithubDebugUnitTest \
            :app:testFdroidDebugUnitTest \
            :app:lintGithubDebug \
            :app:lintFdroidDebug \
            :app:assembleGithubDebug \
            :app:assembleFdroidDebug \
            :app:assembleGithubDebugAndroidTest \
            :app:assembleFdroidDebugAndroidTest \
            :third_party:termlib:testDebugUnitTest \
            :third_party:termlib:lintDebug \
            :third_party:termlib:assembleDebugAndroidTest \
            :third_party:cbssh:test \
            :third_party:cbssh:protocol:test \
            :app:assembleGithubRelease \
            :app:assembleFdroidRelease

      - name: Verify 16 KiB native alignment
        run: |
          build_tools_dir="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          for apk in \
            app/build/outputs/apk/github/debug/app-github-debug.apk \
            app/build/outputs/apk/fdroid/debug/app-fdroid-debug.apk; do
            "$build_tools_dir/zipalign" -c -P 16 -v 4 "$apk"
            bash tools/check-16kb-elf.sh "$apk"
          done
          AAPT2="$build_tools_dir/aapt2" \
            bash tools/check-fdroid-apk.sh app/build/outputs/apk/fdroid/debug/app-fdroid-debug.apk
          python3 tools/check-ssh-migration.py \
            app/build/outputs/apk/github/debug/app-github-debug.apk \
            app/build/outputs/apk/fdroid/debug/app-fdroid-debug.apk

      # This is continuous delivery of an installable debug artifact. Tagged
      # production releases are signed by the dedicated release workflow.
      - name: Upload verified debug APK
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v6
        with:
          name: MangoSSH-debug-${{ github.sha }}
          path: |
            app/build/outputs/apk/github/debug/app-github-debug.apk
            app/build/outputs/apk/fdroid/debug/app-fdroid-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Verify unsigned release packages
        run: |
          build_tools_dir="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          for distribution in github fdroid; do
            apk="app/build/outputs/apk/$distribution/release/app-$distribution-release-unsigned.apk"
            "$build_tools_dir/zipalign" -c -P 16 -v 4 "$apk"
            bash tools/check-16kb-elf.sh "$apk"
          done
          AAPT2="$build_tools_dir/aapt2" bash tools/check-fdroid-apk.sh \
            app/build/outputs/apk/fdroid/release/app-fdroid-release-unsigned.apk

      - name: Upload unsigned release packages for isolated signing
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v6
        with:
          name: MangoSSH-unsigned-${{ github.sha }}
          path: app/build/outputs/apk/*/release/*-unsigned.apk
          if-no-files-found: error
          retention-days: 1

  sign-test-package:
    name: Sign verified test APKs
    needs: verify-and-deliver
    if: github.event_name == 'push' && github.ref_protected && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop')
    runs-on: ubuntu-latest
    environment: ci-signing
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Download this run's verified unsigned APKs
        uses: actions/download-artifact@v8
        with:
          name: MangoSSH-unsigned-${{ github.sha }}
          path: unsigned
          digest-mismatch: error

      - name: Sign with Android SDK tools
        id: sign
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for secret_name in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [[ -z "${!secret_name}" ]]; then
              echo "::notice::Signing secrets unavailable; skipping signed test APKs"
              echo "available=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          done
          key_file="$RUNNER_TEMP/mangossh-ci.keystore"
          trap 'rm -f -- "$key_file"' EXIT
          umask 077
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$key_file"
          build_tools_dir="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          mkdir -p signed
          for distribution in github fdroid; do
            input="unsigned/$distribution/release/app-$distribution-release-unsigned.apk"
            suffix=""
            if [[ "$distribution" == fdroid ]]; then suffix="-fdroid"; fi
            output="signed/MangoSSH-ci-${GITHUB_SHA:0:12}${suffix}.apk"
            "$build_tools_dir/zipalign" -c -P 16 -v 4 "$input"
            "$build_tools_dir/apksigner" sign --ks "$key_file" --ks-key-alias "$ANDROID_KEY_ALIAS" \
              --ks-pass env:ANDROID_KEYSTORE_PASSWORD --key-pass env:ANDROID_KEY_PASSWORD \
              --out "$output" "$input"
            "$build_tools_dir/apksigner" verify --verbose "$output"
            "$build_tools_dir/zipalign" -c -P 16 -v 4 "$output"
          done
          echo "available=true" >> "$GITHUB_OUTPUT"

      - name: Upload signed test packages
        if: steps.sign.outputs.available == 'true'
        uses: actions/upload-artifact@v6
        with:
          name: MangoSSH-release-test-${{ github.sha }}
          path: signed/MangoSSH-ci-*.apk
          if-no-files-found: error
          retention-days: 14

  instrumented-tests:
    name: Run instrumented tests on an emulator
    # Booting an emulator is the slowest signal in this workflow, so it gates
    # pull requests automatically and manual acceptance runs by default.
    # The verify job still compiles instrumented tests on every event.
    if: github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && inputs.run_device_tests)
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Check out source and native Mosh source
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      # Without hardware acceleration the emulator does not finish booting
      # inside the job's budget, and the runner exposes /dev/kvm only after its
      # permissions are opened to every user.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # The tests only need a device new enough to install the app (minSdk 26);
      # this runs on a stable released image rather than the compileSdk preview.
      - name: Prepare disposable SSH fixtures
        run: |
          sudo apt-get update
          sudo apt-get install --yes tmux mosh
          python3 -m venv "$RUNNER_TEMP/ssh-fixture-venv"
          "$RUNNER_TEMP/ssh-fixture-venv/bin/pip" install paramiko==4.0.0

      - name: Run instrumented tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: bash tools/run-device-regressions.sh

      - name: Upload instrumented test report
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: MangoSSH-instrumented-test-report-${{ github.sha }}
          path: app/build/reports/androidTests/connected
          if-no-files-found: warn
          retention-days: 14
