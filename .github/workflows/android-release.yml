# Release Please is the sole writer of version tags and GitHub Releases. Signed
# artifacts are built in this same workflow because events created with the
# built-in GITHUB_TOKEN do not reliably trigger a second release workflow.
name: Android signed release

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing draft release tag to rebuild and publish
        required: false
        type: string

permissions: {}

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-please:
    name: Create or update release PR
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      sha: ${{ steps.release.outputs.sha }}

    steps:
      - name: Run Release Please
        id: release
        uses: googleapis/release-please-action@v5
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  sign-and-publish:
    name: Sign and publish Android release
    needs: release-please
    if: >-
      ${{
        always() &&
        (github.event_name == 'workflow_dispatch' ||
         needs.release-please.outputs.release_created == 'true')
      }}
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions:
      contents: write
    env:
      # The offline dry-run must check the same graph that the release build runs.
      RELEASE_GRADLE_TASKS: >-
        :app:testGithubDebugUnitTest
        :app:testFdroidDebugUnitTest
        :app:lintGithubDebug
        :app:lintFdroidDebug
        :app:assembleGithubRelease
        :app:bundleGithubRelease
        :app:assembleFdroidRelease

    steps:
      - name: Check out source and native Mosh source
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.release-please.outputs.sha || inputs.release_tag || github.ref }}
          submodules: recursive

      # Retrying an existing draft checks out its original tag. Keep the app
      # source at that tag, but load the prefetch helper from this workflow's
      # commit so CI fixes do not require rewriting a published version tag.
      - name: Check out release workflow tools
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          path: .tools/release-workflow
          sparse-checkout: tools/prefetch-gradle-artifacts.gradle
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Prepare native inputs
        uses: ./.github/actions/prepare-native

      - name: Verify release version and localized notes
        env:
          RELEASE_TAG: ${{ needs.release-please.outputs.tag_name || inputs.release_tag }}
        run: |
          if [[ -n "$RELEASE_TAG" ]]; then
            ./gradlew --no-daemon :app:verifyReleaseVersion \
              "-PreleaseTag=$RELEASE_TAG"
          else
            ./gradlew --no-daemon :app:verifyReleaseVersion
          fi

      - name: Prefetch Gradle dependencies for the offline build
        run: |
          ./gradlew --no-daemon --no-configuration-cache \
            -I .tools/release-workflow/tools/prefetch-gradle-artifacts.gradle \
            prefetchOfflineArtifacts

      # The online task graph resolves classpaths created only when Kotlin
      # compile tasks enter the graph. Check the same graph offline before the
      # costly pinned native rebuild.
      - name: Resolve and verify offline release task graph
        run: |
          read -ra release_tasks <<< "$RELEASE_GRADLE_TASKS"
          ./gradlew --no-daemon --dry-run -PmangosshOfflineBuild=true "${release_tasks[@]}"
          ./gradlew --no-daemon --offline --dry-run -PmangosshOfflineBuild=true "${release_tasks[@]}"

      - name: Select artifact version
        env:
          RELEASE_TAG: ${{ needs.release-please.outputs.tag_name || inputs.release_tag }}
        run: |
          if [[ -n "$RELEASE_TAG" ]]; then
            artifact_version="$RELEASE_TAG"
          else
            artifact_version="manual-${GITHUB_SHA:0:12}"
          fi
          echo "MANGOSSH_ARTIFACT_VERSION=$artifact_version" >> "$GITHUB_ENV"

      - name: Install 16 KiB-aware Android zipalign
        run: |
          sdkmanager_bin="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          test -x "$sdkmanager_bin"
          "$sdkmanager_bin" "build-tools;36.0.0"

      - name: Restore release signing key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          for secret_name in \
            ANDROID_KEYSTORE_BASE64 \
            ANDROID_KEYSTORE_PASSWORD \
            ANDROID_KEY_ALIAS \
            ANDROID_KEY_PASSWORD; do
            if [[ -z "${!secret_name}" ]]; then
              echo "::error::$secret_name is not configured"
              exit 1
            fi
          done
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/mangossh-release.keystore"
          test -s "$RUNNER_TEMP/mangossh-release.keystore"

      - name: Test, lint, and build both unsigned distributions
        env:
          MANGOSSH_GO_ROOT: ${{ github.workspace }}/.tools/go/1.26.7
        run: |
          read -ra release_tasks <<< "$RELEASE_GRADLE_TASKS"
          ./gradlew --no-daemon --offline -PmangosshOfflineBuild=true "${release_tasks[@]}"

      # Build Tools 34 is deliberately used for the APK signature because its
      # v2/v3 signing block is compatible with F-Droid's apksigcopier-based
      # reproducible-build verification.
      - name: Sign APK and AAB with the developer key
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          build_tools_dir="$ANDROID_HOME/build-tools/34.0.0"
          test -x "$build_tools_dir/apksigner"
          for distribution in github fdroid; do
            "$build_tools_dir/apksigner" sign \
              --ks "$RUNNER_TEMP/mangossh-release.keystore" \
              --ks-key-alias "$ANDROID_KEY_ALIAS" \
              --ks-pass env:ANDROID_KEYSTORE_PASSWORD \
              --key-pass env:ANDROID_KEY_PASSWORD \
              --out "app/build/outputs/apk/$distribution/release/app-$distribution-release.apk" \
              "app/build/outputs/apk/$distribution/release/app-$distribution-release-unsigned.apk"
          done
          mv app/build/outputs/bundle/githubRelease/app-github-release.aab \
            app/build/outputs/bundle/githubRelease/app-github-release-unsigned.aab
          jarsigner \
            -keystore "$RUNNER_TEMP/mangossh-release.keystore" \
            -storepass:env ANDROID_KEYSTORE_PASSWORD \
            -keypass:env ANDROID_KEY_PASSWORD \
            -signedjar app/build/outputs/bundle/githubRelease/app-github-release.aab \
            app/build/outputs/bundle/githubRelease/app-github-release-unsigned.aab \
            "$ANDROID_KEY_ALIAS"
          rm app/build/outputs/bundle/githubRelease/app-github-release-unsigned.aab

      - name: Ensure source-built artifacts did not modify tracked files
        run: git diff --exit-code

      - name: Verify signed APK and 16 KiB native alignment
        run: |
          signing_tools_dir="$ANDROID_HOME/build-tools/34.0.0"
          alignment_tools_dir="$ANDROID_HOME/build-tools/36.0.0"
          test -x "$signing_tools_dir/apksigner"
          test -x "$alignment_tools_dir/zipalign"
          for apk in \
            app/build/outputs/apk/github/release/app-github-release.apk \
            app/build/outputs/apk/fdroid/release/app-fdroid-release.apk; do
            "$signing_tools_dir/apksigner" verify --verbose "$apk"
            "$alignment_tools_dir/zipalign" -c -P 16 -v 4 "$apk"
            bash tools/check-16kb-elf.sh "$apk"
            python3 tools/native/verify-apk.py "$apk"
          done
          AAPT2="$alignment_tools_dir/aapt2" \
            bash tools/check-fdroid-apk.sh app/build/outputs/apk/fdroid/release/app-fdroid-release.apk

      - name: Upload native provenance and debug symbols
        uses: actions/upload-artifact@v7
        with:
          name: MangoSSH-release-native-${{ github.sha }}
          path: |
            app/build/generated/native/mosh/manifest.json
            app/build/generated/tsnet/manifest.json
            app/build/generated/tsnet/symbols
            app/build/outputs/native-debug-symbols
            app/build/outputs/apk/**/*.native.json
            build/native/cache/mosh-*/**/install/mosh-client
          if-no-files-found: error
          retention-days: 90

      - name: Create versioned release artifacts and checksums
        run: |
          release_dir="app/build/outputs/release"
          apk_name="MangoSSH-$MANGOSSH_ARTIFACT_VERSION.apk"
          fdroid_apk_name="MangoSSH-$MANGOSSH_ARTIFACT_VERSION-fdroid.apk"
          aab_name="MangoSSH-$MANGOSSH_ARTIFACT_VERSION.aab"
          mkdir -p "$release_dir"
          cp app/build/outputs/apk/github/release/app-github-release.apk "$release_dir/$apk_name"
          cp app/build/outputs/apk/fdroid/release/app-fdroid-release.apk "$release_dir/$fdroid_apk_name"
          cp app/build/outputs/bundle/githubRelease/app-github-release.aab "$release_dir/$aab_name"
          (
            cd "$release_dir"
            sha256sum "$apk_name" "$fdroid_apk_name" "$aab_name" > SHA256SUMS
          )

      - name: Upload signed APK and AAB
        uses: actions/upload-artifact@v7
        with:
          name: MangoSSH-signed-${{ github.sha }}
          path: |
            app/build/outputs/release/MangoSSH-*.apk
            app/build/outputs/release/MangoSSH-*.aab
            app/build/outputs/release/SHA256SUMS
          if-no-files-found: error
          retention-days: 90

      # A dispatch without release_tag validates signing and produces an Actions
      # artifact only. A Release Please run or an explicit existing draft tag is
      # published only after every build and verification step has passed.
      - name: Upload assets and publish GitHub Release
        if: >-
          ${{
            needs.release-please.outputs.release_created == 'true' ||
            inputs.release_tag != ''
          }}
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.release-please.outputs.tag_name || inputs.release_tag }}
        run: |
          test -n "$RELEASE_TAG"
          gh release upload "$RELEASE_TAG" \
            "app/build/outputs/release/MangoSSH-$RELEASE_TAG.apk" \
            "app/build/outputs/release/MangoSSH-$RELEASE_TAG-fdroid.apk" \
            "app/build/outputs/release/MangoSSH-$RELEASE_TAG.aab" \
            app/build/outputs/release/SHA256SUMS \
            --clobber
          gh release edit "$RELEASE_TAG" --draft=false
