# Release Please is the sole writer of version tags and GitHub Releases. Signed
# artifacts are built in this same workflow because events created with the
# built-in GITHUB_TOKEN do not reliably trigger a second release workflow.
name: Android signed release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions: {}

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-please:
    name: Create or update release PR
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      sha: ${{ steps.release.outputs.sha }}

    steps:
      - name: Run Release Please
        id: release
        uses: googleapis/release-please-action@v5
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  sign-and-publish:
    name: Sign and publish Android release
    needs: release-please
    if: >-
      ${{
        always() &&
        (github.event_name == 'workflow_dispatch' ||
         needs.release-please.outputs.release_created == 'true')
      }}
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions:
      contents: write

    steps:
      - name: Check out source and native Mosh source
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.release-please.outputs.sha || github.ref }}
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Verify release version and localized notes
        env:
          RELEASE_TAG: ${{ needs.release-please.outputs.tag_name }}
        run: |
          if [[ -n "$RELEASE_TAG" ]]; then
            ./gradlew --no-daemon :app:verifyReleaseVersion \
              "-PreleaseTag=$RELEASE_TAG"
          else
            ./gradlew --no-daemon :app:verifyReleaseVersion
          fi

      - name: Select artifact version
        env:
          RELEASE_TAG: ${{ needs.release-please.outputs.tag_name }}
        run: |
          if [[ -n "$RELEASE_TAG" ]]; then
            artifact_version="$RELEASE_TAG"
          else
            artifact_version="manual-${GITHUB_SHA:0:12}"
          fi
          echo "MANGOSSH_ARTIFACT_VERSION=$artifact_version" >> "$GITHUB_ENV"

      - name: Install 16 KiB-aware Android zipalign
        run: |
          sdkmanager_bin="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          test -x "$sdkmanager_bin"
          "$sdkmanager_bin" "build-tools;36.0.0"

      - name: Cache pinned native toolchains
        uses: actions/cache@v5
        with:
          path: |
            .tools/android-ndk-linux/27.3.13750724
            .tools/android-ndk-r27d-linux.zip
            .tools/downloads/go1.26.5.linux-amd64.tar.gz
            .tools/go/1.26.5
          key: mangossh-native-r27d-go1.26.5-v1

      - name: Install native build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            autoconf automake bison cmake gettext gperf libtool ninja-build \
            pkg-config rsync texinfo unzip zip

      - name: Rebuild PTY and Mosh assets from pinned source
        run: |
          bash tools/fetch-android-ndk.sh
          echo "ANDROID_NDK_HOME=$GITHUB_WORKSPACE/.tools/android-ndk-linux/27.3.13750724" >> "$GITHUB_ENV"
          export ANDROID_NDK_HOME="$GITHUB_WORKSPACE/.tools/android-ndk-linux/27.3.13750724"
          bash tools/build-pty-bridge.sh
          bash tools/build-mosh-android.sh
          bash tools/install-mosh-assets.sh

      - name: Restore release signing key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          for secret_name in \
            ANDROID_KEYSTORE_BASE64 \
            ANDROID_KEYSTORE_PASSWORD \
            ANDROID_KEY_ALIAS \
            ANDROID_KEY_PASSWORD; do
            if [[ -z "${!secret_name}" ]]; then
              echo "::error::$secret_name is not configured"
              exit 1
            fi
          done
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/mangossh-release.keystore"
          test -s "$RUNNER_TEMP/mangossh-release.keystore"

      - name: Test, lint, and build unsigned APK and AAB
        run: ./gradlew --no-daemon :app:testDebugUnitTest :app:lint :app:assembleRelease :app:bundleRelease

      # Build Tools 34 is deliberately used for the APK signature because its
      # v2/v3 signing block is compatible with F-Droid's apksigcopier-based
      # reproducible-build verification.
      - name: Sign APK and AAB with the developer key
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          build_tools_dir="$ANDROID_HOME/build-tools/34.0.0"
          test -x "$build_tools_dir/apksigner"
          "$build_tools_dir/apksigner" sign \
            --ks "$RUNNER_TEMP/mangossh-release.keystore" \
            --ks-key-alias "$ANDROID_KEY_ALIAS" \
            --ks-pass env:ANDROID_KEYSTORE_PASSWORD \
            --key-pass env:ANDROID_KEY_PASSWORD \
            --out app/build/outputs/apk/release/app-release.apk \
            app/build/outputs/apk/release/app-release-unsigned.apk
          mv app/build/outputs/bundle/release/app-release.aab \
            app/build/outputs/bundle/release/app-release-unsigned.aab
          jarsigner \
            -keystore "$RUNNER_TEMP/mangossh-release.keystore" \
            -storepass:env ANDROID_KEYSTORE_PASSWORD \
            -keypass:env ANDROID_KEY_PASSWORD \
            -signedjar app/build/outputs/bundle/release/app-release.aab \
            app/build/outputs/bundle/release/app-release-unsigned.aab \
            "$ANDROID_KEY_ALIAS"
          rm app/build/outputs/bundle/release/app-release-unsigned.aab

      - name: Verify signed APK and 16 KiB native alignment
        run: |
          signing_tools_dir="$ANDROID_HOME/build-tools/34.0.0"
          alignment_tools_dir="$ANDROID_HOME/build-tools/36.0.0"
          test -x "$signing_tools_dir/apksigner"
          test -x "$alignment_tools_dir/zipalign"
          "$signing_tools_dir/apksigner" verify --verbose app/build/outputs/apk/release/app-release.apk
          "$alignment_tools_dir/zipalign" -c -P 16 -v 4 app/build/outputs/apk/release/app-release.apk
          bash tools/check-16kb-elf.sh app/build/outputs/apk/release/app-release.apk

      - name: Create versioned release artifacts and checksums
        run: |
          release_dir="app/build/outputs/release"
          apk_name="MangoSSH-$MANGOSSH_ARTIFACT_VERSION.apk"
          aab_name="MangoSSH-$MANGOSSH_ARTIFACT_VERSION.aab"
          mkdir -p "$release_dir"
          cp app/build/outputs/apk/release/app-release.apk "$release_dir/$apk_name"
          cp app/build/outputs/bundle/release/app-release.aab "$release_dir/$aab_name"
          (
            cd "$release_dir"
            sha256sum "$apk_name" "$aab_name" > SHA256SUMS
          )

      - name: Upload signed APK and AAB
        uses: actions/upload-artifact@v6
        with:
          name: MangoSSH-signed-${{ github.sha }}
          path: |
            app/build/outputs/release/MangoSSH-*.apk
            app/build/outputs/release/MangoSSH-*.aab
            app/build/outputs/release/SHA256SUMS
          if-no-files-found: error
          retention-days: 90

      # Manual dispatch validates signing and produces an Actions artifact only.
      # A Release Please run uploads to its draft release, then publishes it only
      # after every build, signature, alignment, and checksum check has passed.
      - name: Upload assets and publish GitHub Release
        if: needs.release-please.outputs.release_created == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.release-please.outputs.tag_name }}
        run: |
          test -n "$RELEASE_TAG"
          gh release upload "$RELEASE_TAG" \
            "app/build/outputs/release/MangoSSH-$RELEASE_TAG.apk" \
            "app/build/outputs/release/MangoSSH-$RELEASE_TAG.aab" \
            app/build/outputs/release/SHA256SUMS \
            --clobber
          gh release edit "$RELEASE_TAG" --draft=false
