# Signed releases are generated only from version tags. The signing key is
# restored from GitHub Secrets into the ephemeral runner and never committed.
name: Android signed release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

# Required for creating a GitHub Release and attaching signed APK/AAB assets.
permissions:
  contents: write

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  sign-and-publish:
    name: Sign and publish Android release
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: Check out source and native Mosh source
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Verify release tag matches the Android version
        if: github.event_name == 'push'
        run: |
          version_name="$(sed -n 's/^[[:space:]]*versionName = "\([^"]*\)"/\1/p' app/build.gradle.kts)"
          version_code="$(sed -n 's/^[[:space:]]*versionCode = \([0-9][0-9]*\)/\1/p' app/build.gradle.kts)"
          test -n "$version_name"
          test -n "$version_code"
          test "$GITHUB_REF_NAME" = "v$version_name"
          test "$version_code" = "1"

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Install 16 KiB-aware Android zipalign
        run: sdkmanager "build-tools;36.0.0"

      - name: Cache pinned native toolchains
        uses: actions/cache@v5
        with:
          path: |
            .tools/android-ndk-linux/27.3.13750724
            .tools/android-ndk-r27d-linux.zip
            .tools/downloads/go1.26.5.linux-amd64.tar.gz
            .tools/go/1.26.5
          key: mangossh-native-r27d-go1.26.5-v1

      - name: Install native build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            autoconf automake bison cmake gettext gperf libtool ninja-build \
            pkg-config rsync texinfo unzip zip

      - name: Rebuild PTY and Mosh assets from pinned source
        run: |
          bash tools/fetch-android-ndk-wsl.sh
          echo "ANDROID_NDK_HOME=$GITHUB_WORKSPACE/.tools/android-ndk-linux/27.3.13750724" >> "$GITHUB_ENV"
          export ANDROID_NDK_HOME="$GITHUB_WORKSPACE/.tools/android-ndk-linux/27.3.13750724"
          bash tools/build-pty-bridge-wsl.sh
          bash tools/build-mosh-android-wsl.sh
          bash tools/install-mosh-assets.sh

      - name: Restore release signing key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          for secret_name in \
            ANDROID_KEYSTORE_BASE64 \
            ANDROID_KEYSTORE_PASSWORD \
            ANDROID_KEY_ALIAS \
            ANDROID_KEY_PASSWORD; do
            if [[ -z "${!secret_name}" ]]; then
              echo "::error::$secret_name is not configured"
              exit 1
            fi
          done
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/mangossh-release.keystore"
          test -s "$RUNNER_TEMP/mangossh-release.keystore"

      - name: Test, lint, and build unsigned APK and AAB
        run: ./gradlew --no-daemon :app:testDebugUnitTest :app:lint :app:assembleRelease :app:bundleRelease

      # Build Tools 34 is deliberately used for the APK signature because its
      # v2/v3 signing block is compatible with F-Droid's apksigcopier-based
      # reproducible-build verification.
      - name: Sign APK and AAB with the developer key
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          build_tools_dir="$ANDROID_HOME/build-tools/34.0.0"
          test -x "$build_tools_dir/apksigner"
          "$build_tools_dir/apksigner" sign \
            --ks "$RUNNER_TEMP/mangossh-release.keystore" \
            --ks-key-alias "$ANDROID_KEY_ALIAS" \
            --ks-pass env:ANDROID_KEYSTORE_PASSWORD \
            --key-pass env:ANDROID_KEY_PASSWORD \
            --out app/build/outputs/apk/release/app-release.apk \
            app/build/outputs/apk/release/app-release-unsigned.apk
          mv app/build/outputs/bundle/release/app-release.aab \
            app/build/outputs/bundle/release/app-release-unsigned.aab
          jarsigner \
            -keystore "$RUNNER_TEMP/mangossh-release.keystore" \
            -storepass:env ANDROID_KEYSTORE_PASSWORD \
            -keypass:env ANDROID_KEY_PASSWORD \
            -signedjar app/build/outputs/bundle/release/app-release.aab \
            app/build/outputs/bundle/release/app-release-unsigned.aab \
            "$ANDROID_KEY_ALIAS"
          rm app/build/outputs/bundle/release/app-release-unsigned.aab

      - name: Verify signed APK and 16 KiB native alignment
        run: |
          signing_tools_dir="$ANDROID_HOME/build-tools/34.0.0"
          alignment_tools_dir="$ANDROID_HOME/build-tools/36.0.0"
          test -x "$signing_tools_dir/apksigner"
          test -x "$alignment_tools_dir/zipalign"
          "$signing_tools_dir/apksigner" verify --verbose app/build/outputs/apk/release/app-release.apk
          "$alignment_tools_dir/zipalign" -c -P 16 -v 4 app/build/outputs/apk/release/app-release.apk
          bash tools/check-16kb-elf-wsl.sh app/build/outputs/apk/release/app-release.apk

      - name: Create release checksums
        run: |
          mkdir -p app/build/outputs/release
          cd app/build/outputs
          sha256sum \
            apk/release/app-release.apk \
            bundle/release/app-release.aab |
            sed -e 's#  apk/release/#  #' -e 's#  bundle/release/#  #' \
              > release/SHA256SUMS

      - name: Upload signed APK and AAB
        uses: actions/upload-artifact@v6
        with:
          name: MangoSSH-signed-${{ github.sha }}
          path: |
            app/build/outputs/apk/release/app-release.apk
            app/build/outputs/bundle/release/app-release.aab
            app/build/outputs/release/SHA256SUMS
          if-no-files-found: error
          retention-days: 90

      # Manual dispatch validates signing without creating a release. A pushed
      # version tag creates a matching GitHub Release containing both artifacts.
      - name: Create GitHub Release
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --verify-tag \
            --title "$GITHUB_REF_NAME" \
            --generate-notes \
            app/build/outputs/apk/release/app-release.apk \
            app/build/outputs/bundle/release/app-release.aab \
            app/build/outputs/release/SHA256SUMS
