AutoName: MangoSSH

RepoType: git
Repo: https://github.com/sunging/MangoSSH.git
Binaries: https://github.com/sunging/MangoSSH/releases/download/v%v/MangoSSH-v%v-fdroid.apk

Builds:
  - versionName: 0.4.1
    versionCode: 4001
    commit: RELEASE_COMMIT_SHA
    submodules: true
    sudo:
      - apt-get update
      - apt-get install -y autoconf automake binutils bison build-essential cmake gettext git
        golang-go gperf libtool ninja-build pkg-config rsync texinfo unzip zip
    timeout: 14400
    srclibs:
      - go120mangossh@90a870f1dc49bfcc6ffe95f80fbaf21875198e7a
      - go122mangossh@5817e650946aaa0ac28956de96b3f9aa1de4b299
      - go124mangossh@7f36edc26d4e3becb6d9c9008ff00f260bb19055
      - go@c19862e5f8415b4f24b189d065ed739517c548ba
      - zlib@51b7f2abdade71cd9bb0e7a373ef2610ec6f9daf
      - protobufmangossh@796e49f6ca82f763d1087d2ff7355d2f0d7b71b1
      - ncursesmangossh@79b9071f2be20a24c7be031655a5638f6032f29f
      - gmpmangossh@2bbd52703e5af82509773264bfbd20ff8464804f
      - nettlemangossh@b8c841dc3278dec0812365f02370b41ea9d4ddee
    scandelete:
      - app/src/main/jniLibs
      - app/src/main/assets/mosh/terminfo.zip
    build: |-
      mkdir -p .fdroid/mosh-deps
      ln -s $$go120mangossh$$ .fdroid/mosh-deps/go-bootstrap-1.20.14
      ln -s $$go122mangossh$$ .fdroid/mosh-deps/go-bootstrap-1.22.12
      ln -s $$go124mangossh$$ .fdroid/mosh-deps/go-bootstrap-1.24.6
      ln -s $$zlib$$ .fdroid/mosh-deps/zlib
      ln -s $$protobufmangossh$$ .fdroid/mosh-deps/protobuf
      ln -s $$ncursesmangossh$$ .fdroid/mosh-deps/ncurses
      ln -s $$gmpmangossh$$ .fdroid/mosh-deps/gmp
      ln -s $$nettlemangossh$$ .fdroid/mosh-deps/nettle
      export MANGOSSH_GO_SOURCE=$$go$$
      export MANGOSSH_MOSH_DEPS_DIR=$PWD/.fdroid/mosh-deps
      export MANGOSSH_GO_ROOT=$PWD/.tools/go/1.26.5
      bash tools/prepare-fdroid-native.sh
    buildjni: no
    ndk: r27d
    gradle:
      - fdroid
    gradleprops:
      - mangosshOfflineBuild=true
    output: app/build/outputs/apk/fdroid/release/app-fdroid-release-unsigned.apk

AllowedAPKSigningKeys: 6ad86ccb0026c60606b016a643fb5f90c090035591c2c734d0fd66004b9373be

MaintainerNotes: |-
  The fdroid flavor has no self-update client, package-install permission,
  update FileProvider, or installer handoff. The embedded Tailscale source is
  vendored; its logtail identity and network upload are disabled by the
  upstream-visible patch under tools/patches and the bridge sets no-support
  logging before startup. Generated PTY, Mosh, and terminfo files tracked by
  upstream are deleted by the scanner and rebuilt from the pinned sources.

AutoUpdateMode: Version
UpdateCheckMode: Tags ^v[0-9]+\.[0-9]+\.[0-9]+$
UpdateCheckData: version-code.txt|^(\d+)$||^v([0-9]+\.[0-9]+\.[0-9]+)$
